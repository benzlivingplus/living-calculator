  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ry: #7a1e2b;          /* แดงเลือดหมู */\n    --primary-dark: #5c1620;\n    --primary-soft: #fbecec;\n    --primary-tint: #f1d7d8;\n    --success: #4f6b2a;\n    --success-soft: #eef3e0;\n    --danger: #8b2828;\n    --shadow-sm: 0 1px 2px rgba(58, 20, 16, 0.05);\n    --shadow-md: 0 4px 14px rgba(58, 20, 16, 0.07);\n    --radius: 10px;\n    --radius-sm: 6px;\n    --font-sans: \"Sarabun\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n    --font-mono: \"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n  }\n\n  * { box-sizing: border-box; }\n\n  html, body {\n    margin: 0;\n    padding: 0;\n    background: var(--bg);\n    color: var(--text);\n    font-family: var(--font-sans);\n    font-size: 14px;\n    line-height: 1.55;\n    -webkit-font-smoothing: antialiased;\n  }\n\n  .wrap {\n    max-width: 800px;\n    margin: 0 auto;\n    padding: 20px 16px 40px;\n  }\n\n  /* Header */\n  .header {\n    margin-bottom: 16px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 16px;\n  }\n  .header-text { flex: 1; min-width: 0; }\n  .header-logo {\n    height: 56px;\n    width: auto;\n    flex-shrink: 0;\n    object-fit: contain;\n  }\n  @media (max-width: 480px) {\n    .header { flex-direction: column-reverse; align-items: flex-start; gap: 8px; }\n    .header-logo { height: 44px; }\n  }\n  .header h1 {\n    font-size: 22px;\n    font-weight: 700;\n    margin: 0;\n    letter-spacing: -0.005em;\n    color: var(--primary);\n  }\n  .header .sub {\n    font-size: 13px;\n    color: var(--text-muted);\n    margin-top: 2px;\n  }\n\n  /* Tabs */\n  .tabs {\n    display: flex;\n    gap: 4px;\n    background: var(--surface);\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    padding: 4px;\n    margin-bottom: 16px;\n    box-shadow: var(--shadow-sm);\n  }\n  .tab {\n    flex: 1;\n    appearance: none;\n    border: 0;\n    background: transparent;\n    color: var(--text-muted);\n    font: inherit;\n    font-weight: 500;\n    padding: 10px 8px;\n    border-radius: var(--radius-sm);\n    cursor: pointer;\n    transition: background 0.15s, color 0.15s;\n    text-align: center;\n    line-height: 1.25;\n  }\n  .tab:hover {\n    color: var(--text);\n    background: var(--surface-2);\n  }\n  .tab[aria-selected=\"true\"] {\n    background: var(--primary);\n    color: #fff;\n  }\n\n  /* Cards */\n  .card {\n    background: var(--surface);\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    padding: 20px;\n    box-shadow: var(--shadow-sm);\n    margin-bottom: 16px;\n  }\n  .card-title {\n    font-size: 13px;\n    font-weight: 600;\n    letter-spacing: 0.02em;\n    color: var(--primary);\n    margin: 0 0 14px;\n    padding-bottom: 10px;\n    border-bottom: 1px solid var(--border);\n  }\n\n  /* Form grid */\n  .grid {\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 14px 16px;\n  }\n  .grid.cols-1 { grid-template-columns: 1fr; }\n  .field { display: flex; flex-direction: column; gap: 6px; }\n  .field.full { grid-column: 1 / -1; }\n  .field label {\n    font-size: 13px;\n    font-weight: 500;\n    color: var(--text-muted);\n  }\n\n  .input-wrap {\n    position: relative;\n    display: flex;\n    align-items: stretch;\n  }\n  .input-wrap input {\n    width: 100%;\n    padding: 10px 12px;\n    border: 1px solid var(--border-strong);\n    border-radius: var(--radius-sm);\n    font: inherit;\n    font-size: 14px;\n    color: var(--text);\n    background: #fff;\n    transition: border-color 0.15s, box-shadow 0.15s;\n  }\n  .input-wrap input:focus {\n    outline: none;\n    border-color: var(--primary);\n    box-shadow: 0 0 0 3px var(--primary-soft);\n  }\n  .input-wrap .suffix {\n    position: absolute;\n    right: 10px;\n    top: 50%;\n    transform: translateY(-50%);\n    font-size: 12px;\n    color: var(--text-faint);\n    font-family: var(--font-mono);\n    pointer-events: none;\n  }\n  .input-wrap input.has-suffix { padding-right: 56px; }\n\n  /* Segmented */\n  .seg {\n    display: inline-flex;\n    background: var(--surface-2);\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n    padding: 3px;\n    gap: 2px;\n  }\n  .seg button {\n    appearance: none;\n    border: 0;\n    background: transparent;\n    color: var(--text-muted);\n    font: inherit;\n    font-size: 13px;\n    font-weight: 500;\n    padding: 6px 12px;\n    border-radius: 4px;\n    cursor: pointer;\n  }\n  .seg button[aria-selected=\"true\"] {\n    background: #fff;\n    color: var(--primary);\n    box-shadow: var(--shadow-sm);\n  }\n\n  /* Compare two-column */\n  .compare {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 16px;\n  }\n  .compare .col {\n    background: var(--surface-2);\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n    padding: 14px;\n  }\n  .compare .col h3 {\n    margin: 0 0 12px;\n    font-size: 13px;\n    font-weight: 600;\n    color: var(--text-muted);\n  }\n  .compare .col.new h3 { color: var(--primary); }\n\n  /* Result hero */\n  .result-hero {\n    background: linear-gradient(180deg, var(--primary-soft) 0%, #fff 100%);\n    border: 1px solid var(--primary-tint);\n  }\n  .hero-label {\n    font-size: 13px;\n    letter-spacing: 0.02em;\n    color: var(--primary-dark);\n    font-weight: 600;\n    margin: 0 0 4px;\n  }\n  .hero-amount {\n    font-size: 44px;\n    font-weight: 700;\n    color: var(--text);\n    letter-spacing: -0.02em;\n    line-height: 1.1;\n    font-variant-numeric: tabular-nums;\n  }\n  .hero-amount .cur {\n    font-size: 18px;\n    font-weight: 500;\n    color: var(--text-muted);\n    margin-right: 6px;\n    letter-spacing: 0;\n  }\n  .hero-sub {\n    font-size: 13px;\n    color: var(--text-muted);\n    margin-top: 4px;\n  }\n  .hero-stats {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 12px;\n    margin-top: 18px;\n    padding-top: 16px;\n    border-top: 1px solid var(--primary-tint);\n  }\n  .stat-label {\n    font-size: 12px;\n    color: var(--text-muted);\n    font-weight: 500;\n  }\n  .stat-value {\n    font-size: 16px;\n    font-weight: 600;\n    color: var(--text);\n    margin-top: 2px;\n    font-variant-numeric: tabular-nums;\n  }\n\n  /* Refinance result */\n  .refi-hero {\n    background: linear-gradient(180deg, var(--success-soft) 0%, #fff 100%);\n    border-color: #d2dcb5;\n  }\n  .year-tiles {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 10px;\n  }\n  .yt-tile {\n    background: var(--primary-soft);\n    border: 1px solid var(--primary-tint);\n    border-radius: var(--radius-sm);\n    padding: 12px 12px;\n    display: flex;\n    flex-direction: column;\n    gap: 4px;\n  }\n  .yt-tile.yt-primary {\n    background: var(--primary-soft);\n    border-color: var(--primary);\n    /* same look as other tiles, kept class for backwards compat */\n  }\n  .yt-label { font-size: 12px; color: var(--text-muted); font-weight: 500; line-height: 1.3; }\n  .yt-y { color: var(--text-faint); font-weight: 400; }\n  .yt-amount {\n    font-size: 22px;\n    font-weight: 700;\n    color: var(--primary);\n    font-variant-numeric: tabular-nums;\n    line-height: 1.1;\n    margin-top: 2px;\n  }\n  .yt-amount .cur { font-size: 13px; font-weight: 500; margin-right: 2px; }\n  .yt-tile.yt-primary .yt-amount { font-size: 26px; }\n  .yt-meta { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }\n  @media (max-width: 720px) {\n    .year-tiles { grid-template-columns: repeat(2, 1fr); }\n  }\n  @media (max-width: 420px) {\n    .year-tiles { grid-template-columns: 1fr; }\n  }\n    .refi-hero .hero-label { color: var(--success); }\n  .refi-hero .hero-stats { border-top-color: #d2dcb5; }\n  .refi-hero.negative {\n    background: linear-gradient(180deg, var(--primary-soft) 0%, #fff 100%);\n    border-color: var(--primary-tint);\n  }\n  .refi-hero.negative .hero-label { color: var(--danger); }\n  .refi-hero.negative .hero-stats { border-top-color: var(--primary-tint); }\n\n  /* Buttons */\n  .actions {\n    display: flex;\n    gap: 8px;\n    flex-wrap: wrap;\n    margin-top: 16px;\n  }\n  .btn {\n    appearance: none;\n    border: 1px solid var(--border-strong);\n    background: #fff;\n    color: var(--text);\n    font: inherit;\n    font-size: 13px;\n    font-weight: 500;\n    padding: 9px 14px;\n    border-radius: var(--radius-sm);\n    cursor: pointer;\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    transition: background 0.15s, border-color 0.15s;\n  }\n  .btn:hover { background: var(--surface-2); border-color: var(--text-faint); }\n  .btn-primary {\n    background: var(--primary);\n    border-color: var(--primary);\n    color: #fff;\n  }\n  .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }\n  .btn-icon {\n    width: 14px;\n    height: 14px;\n    stroke: currentColor;\n    stroke-width: 2;\n    fill: none;\n  }\n\n  /* Amortization */\n  .amort-toggle {\n    width: 100%;\n    text-align: left;\n    background: transparent;\n    border: 0;\n    padding: 0;\n    cursor: pointer;\n    font: inherit;\n    color: var(--text);\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    font-size: 14px;\n  }\n  .amort-toggle .chevron {\n    transition: transform 0.2s;\n    color: var(--text-faint);\n  }\n  .amort-toggle[aria-expanded=\"true\"] .chevron {\n    transform: rotate(180deg);\n  }\n  .amort-content {\n    margin-top: 14px;\n    display: none;\n  }\n  .amort-content.open { display: block; }\n\n  .table-wrap {\n    overflow-x: auto;\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n    max-height: 360px;\n    overflow-y: auto;\n  }\n  table {\n    width: 100%;\n    border-collapse: collapse;\n    font-size: 13px;\n    font-variant-numeric: tabular-nums;\n  }\n  thead {\n    position: sticky;\n    top: 0;\n    background: var(--surface-2);\n    z-index: 1;\n  }\n  th, td {\n    padding: 8px 12px;\n    text-align: right;\n    border-bottom: 1px solid var(--border);\n    white-space: nowrap;\n  }\n  th:first-child, td:first-child {\n    text-align: left;\n    font-weight: 500;\n    color: var(--text-muted);\n  }\n  th {\n    font-weight: 600;\n    color: var(--text-muted);\n    font-size: 12px;\n  }\n  tbody tr:hover { background: var(--surface-2); }\n  tbody tr:last-child td { border-bottom: 0; }\n  tbody tr.year-end td {\n    background: var(--primary-soft);\n    font-weight: 500;\n  }\n\n  .toast {\n    position: fixed;\n    bottom: 24px;\n    left: 50%;\n    transform: translateX(-50%) translateY(20px);\n    background: var(--text);\n    color: #fff;\n    padding: 9px 16px;\n    border-radius: 6px;\n    font-size: 13px;\n    opacity: 0;\n    pointer-events: none;\n    transition: opacity 0.2s, transform 0.2s;\n    z-index: 100;\n  }\n  .toast.show {\n    opacity: 1;\n    transform: translateX(-50%) translateY(0);\n  }\n\n  .help {\n    font-size: 12px;\n    color: var(--text-faint);\n    margin-top: 6px;\n    line-height: 1.5;\n  }\n\n  .hidden { display: none !important; }\n\n  /* Rate tiers */\n  .rate-tiers {\n    margin-top: 14px;\n    padding: 14px;\n    background: var(--surface-2);\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n  }\n  .rate-tiers-label {\n    font-size: 13px;\n    font-weight: 500;\n    color: var(--text-muted);\n    margin-bottom: 10px;\n  }\n  .rate-tiers-grid {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 10px;\n  }\n  .rate-tiers-grid .field label { font-size: 12px; }\n  .rate-tiers-grid .input-wrap input { padding: 8px 10px; font-size: 13px; }\n  .rate-tiers-grid .input-wrap input.has-suffix { padding-right: 32px; }\n\n  /* Compare summary (home extra payment) */\n  .compare-summary {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 12px;\n    margin-bottom: 18px;\n  }\n  .compare-side {\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n    padding: 14px;\n    background: var(--surface-2);\n  }\n  .compare-side.extra {\n    background: var(--primary-soft);\n    border-color: var(--primary-tint);\n  }\n  .compare-side-title {\n    font-size: 12px;\n    font-weight: 600;\n    color: var(--text-muted);\n    margin-bottom: 10px;\n    padding-bottom: 8px;\n    border-bottom: 1px solid var(--border);\n  }\n  .compare-side.extra .compare-side-title {\n    color: var(--primary-dark);\n    border-bottom-color: var(--primary-tint);\n  }\n  .compare-row {\n    display: flex;\n    justify-content: space-between;\n    align-items: baseline;\n    padding: 4px 0;\n    font-size: 13px;\n  }\n  .compare-row span { color: var(--text-muted); }\n  .compare-row strong {\n    font-weight: 600;\n    color: var(--text);\n    font-variant-numeric: tabular-nums;\n  }\n\n  /* Chart */\n  .chart-wrap {\n    margin: 8px 0 16px;\n  }\n  .chart-title {\n    font-size: 12px;\n    font-weight: 500;\n    color: var(--text-muted);\n    margin-bottom: 8px;\n  }\n  #h-chart {\n    width: 100%;\n    height: 240px;\n    display: block;\n    background: linear-gradient(180deg, #fff 0%, var(--surface-2) 100%);\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n  }\n  .chart-legend {\n    display: flex;\n    gap: 18px;\n    margin-top: 8px;\n    font-size: 12px;\n    color: var(--text-muted);\n  }\n  .legend-item { display: inline-flex; align-items: center; gap: 6px; }\n  .swatch {\n    width: 14px;\n    height: 3px;\n    border-radius: 2px;\n    display: inline-block;\n  }\n  .swatch.base { background: #9a7a6c; }\n  .swatch.extra { background: var(--primary); }\n\n  /* Savings summary */\n  .savings-summary {\n    background: var(--success-soft);\n    border: 1px solid #d2dcb5;\n    border-radius: var(--radius-sm);\n    padding: 14px 16px;\n  }\n  .savings-summary.zero {\n    background: var(--surface-2);\n    border-color: var(--border);\n  }\n  .savings- pan class=\"suffix\">ปี<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"col new\">\n          <h3>สินเชื่อใหม่<\u002Fh3>\n          <div class=\"grid cols-1\">\n            <div class=\"field\">\n              <label>เงินต้นใหม่<\u002Flabel>\n              <div class=\"input-wrap\">\n                <input type=\"number\" id=\"r-new-principal\" placeholder=\"เช่น 2,500,000\" min=\"0\" step=\"10000\" class=\"has-suffix\">\n                <span class=\"suffix\">บาท<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>ดอกเบี้ยใหม่<\u002Flabel>\n              <div class=\"input-wrap\">\n                <input type=\"number\" id=\"r-new-rate\" placeholder=\"เช่น 3.25\" min=\"0\" step=\"0.05\" class=\"has-suffix\">\n                <span class=\"suffix\">% / ปี<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>ระยะเวลาใหม่<\u002Flabel>\n              <div class=\"input-wrap\">\n                <input type=\"number\" id=\"r-new-term\" placeholder=\"เช่น 20\" min=\"1\" max=\"40\" step=\"1\" class=\"has-suffix\">\n                <span class=\"suffix\">ปี<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>ค่าธรรมเนียมรีไฟแนนซ์ (ถ้ามี)<\u002Flabel>\n              <div class=\"input-wrap\">\n                <input type=\"number\" id=\"r-fees\" placeholder=\"0\" min=\"0\" step=\"1000\" class=\"has-suffix\">\n                <span class=\"suffix\">บาท<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card refi-hero\" id=\"r-result\">\n      <div class=\"hero-label\">ประหยัดต่อเดือน<\u002Fdiv>\n      <div class=\"hero-amount\"><span class=\"cur\">฿<\u002Fspan><span data-out=\"r-saving-monthly\">0<\u002Fspan><\u002Fdiv>\n      <div class=\"hero-sub\">ค่างวด <span data-out=\"r-old-monthly\">0<\u002Fspan> → <span data-out=\"r-new-monthly\">0<\u002Fspan> บาท / เดือน<\u002Fdiv>\n      <div class=\"hero-stats\">\n        <div>\n          <div class=\"stat-label\">จุดคุ้มทุน<\u002Fdiv>\n          <div class=\"stat-value\"><span data-out=\"r-breakeven\">—<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"stat-label\">ประหยัดรวม<\u002Fdiv>\n          <div class=\"stat-value\">฿<span data-out=\"r-saving-total\">0<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"stat-label\">ดอกเบี้ยที่ลด<\u002Fdiv>\n          <div class=\"stat-value\">฿<span data-out=\"r-saving-interest\">0<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"actions\">\n        <button class=\"btn btn-primary\" data-action=\"copy\" data-mode=\"refi\">\n          <svg class=\"btn-icon\" viewBox=\"0 0 24 24\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M5 15V5a2 2 0 0 1 2-2h10\"><\u002Fpath><\u002Fsvg>\n          คัดลอกผลลัพธ์\n        <\u002Fbutton>\n        <button class=\"btn\" onclick=\"window.print()\">\n          <svg class=\"btn-icon\" viewBox=\"0 0 24 24\"><polyline points=\"6 9 6 2 18 2 18 9\"><\u002Fpolyline><path d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\"><\u002Fpath><rect x=\"6\" y=\"14\" width=\"12\" height=\"8\"><\u002Frect><\u002Fsvg>\n          พิมพ์\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <button class=\"amort-toggle\" aria-expanded=\"false\" data-amort=\"refi\">\n        <span><strong>ตารางเปรียบเทียบ<\u002Fstrong> <span style=\"color:var(--text-faint);font-weight:400;\">· แสดงรายเดือน<\u002Fspan><\u002Fspan>\n        <svg class=\"chevron\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fbutton>\n      <div class=\"amort-content\" data-amort-content=\"refi\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<div class=\"toast\" id=\"toast\">คัดลอกแล้ว<\u002Fdiv>\n\n<script>\n/* =========================================================\n   Financial functions — เทียบเท่า Google Sheets\n   PMT, IPMT, PPMT (ลดต้นลดดอก / annuity amortization)\n   ========================================================= */\n\nfunction PMT(rate, nper, pv) {\n  if (rate === 0) return -pv / nper;\n  return -(pv * rate) / (1 - Math.pow(1 + rate, -nper));\n}\n\nfunction IPMT(rate, per, nper, pv) {\n  if (rate === 0) return 0;\n  const pmt = PMT(rate, nper, pv);\n  const balanceStart = pv * Math.pow(1 + rate, per - 1)\n                     + pmt * (Math.pow(1 + rate, per - 1) - 1) / rate;\n  return -balanceStart * rate;\n}\n\nfunction PPMT(rate, per, nper, pv) {\n  return PMT(rate, nper, pv) - IPMT(rate, per, nper, pv);\n}\n\n/* =========================================================\n   Formatters\n   ========================================================= */\nconst fmt0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });\nconst fmt2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\nfunction money(n) { return fmt2.format(Math.round(n * 100) / 100); }\nfunction moneyR(n) { return fmt0.format(Math.round(n)); }\n\n/* =========================================================\n   Schedule builders\n   ========================================================= */\nfunction buildReducingSchedule(principal, annualRatePct, years) {\n  const r = (annualRatePct / 100) / 12;\n  const n = Math.round(years * 12);\n  const monthly = -PMT(r, n, principal);\n  const rows = [];\n  let balance = principal;\n  let totalInterest = 0;\n  for (let i = 1; i <= n; i++) {\n    const interest = balance * r;\n    let principalPart = monthly - interest;\n    if (i === n) { principalPart = balance; }\n    balance = Math.max(0, balance - principalPart);\n    totalInterest += interest;\n    rows.push({\n      month: i,\n      payment: principalPart + interest,\n      principal: principalPart,\n      interest: interest,\n      balance: balance\n    });\n  }\n  return { rows, monthly, n, totalInterest, totalPayment: monthly * n };\n}\n\n/**\n * Tiered home loan schedule:\n * - rates: [r1, r2, r3, r4] in % (annual). r1..r3 used in years 1..3, r4 thereafter.\n * - termYears: full loan term used to compute the *base* monthly installment\n *   (ธนาคารไทยมัก fix ค่างวดปีที่ 1 ตลอดอายุสัญญา) — we keep that contractual installment.\n * - extraMonthly: โป๊ะเงินต้นส่วนเพิ่มต่องวด\n */\nfunction buildHomeSchedule(principal, rates, termYears, extras, mode) {\n  // extras: [e1,e2,e3,e4+] โป๊ะเงินต้น/เดือน รายปี\n  // mode: 'flat3' | 'step1' | 'step3'\n  //   flat3 = ผ่อนค่างวดเดียวตลอดสัญญา (จากดอกเบี้ยปีที่ 4)\n  //   step1 = 3 ปีแรกผ่อนเท่ากัน (ใช้ดอกเบี้ยสูงสุดในช่วงโปร) แล้วปีที่ 4 จึงเปลี่ยนเป็นค่างวดตามดอกเบี้ยปีที่ 4\n  //   step3 = แต่ละปี (1,2,3,4+) คำนวณค่างวดของตัวเองจากเงินต้นคงเหลือ + ระยะเวลาคงเหลือ\n  const totalMonths = Math.round(termYears * 12);\n  if (!Array.isArray(extras)) extras = [extras||0, extras||0, extras||0, extras||0];\n  const safeMode = mode || 'flat3';\n  // ค่างวดสัญญา (ใช้สำหรับ flat3) = คำนวณจากดอกเบี้ยปีที่ 4 เป็นต้นไป\n  const contractRate = (rates[3] / 100) / 12;\n  const baseMonthly = contractRate === 0\n    ? principal / totalMonths\n    : -PMT(contractRate, totalMonths, principal);\n  // ค่างวดสำหรับโหมด step1 (3 ปีแรก) ใช้ดอกเบี้ยสูงสุดในปี 1-3\n  const promoMaxRate = Math.max(rates[0], rates[1], rates[2]);\n  const promoR = (promoMaxRate / 100) / 12;\n  const step1PromoMonthly = promoR === 0\n    ? principal / totalMonths\n    : -PMT(promoR, totalMonths, principal);\n\n  const rows = [];\n  let balance = principal;          // actual balance (with extras applied)\n  let scheduledBalance = principal; // hypothetical balance if no extras — drives installment recalc\n  let lockedInstallment = null;     // installment for current year (locked at year start)\n  let totalInterest = 0;\n  let totalExtra = 0;\n  let i = 1;\n  const cap = Math.min(2000, totalMonths + 120);\n  while (balance > 0.005 && i <= cap) {\n    const yearIdx = Math.ceil(i / 12);\n    const monthInYear = ((i - 1) % 12) + 1;\n    let ratePct;\n    if (yearIdx === 1) ratePct = rates[0];\n    else if (yearIdx === 2) ratePct = rates[1];\n    else if (yearIdx === 3) ratePct = rates[2];\n    else ratePct = rates[3];\n    const r = (ratePct / 100) / 12;\n    const interest = balance * r;\n    // ล็อกค่างวดที่เดือนแรกของแต่ละปี (สำหรับ step1 / step3)\n    if (monthInYear === 1) {\n      if (safeMode === 'flat3') {\n        lockedInstallment = baseMonthly;\n      } else if (safeMode === 'step1') {\n        if (yearIdx <= 3) {\n          lockedInstallment = step1PromoMonthly;\n        } else {\n          // ปีที่ 4 เป็นต้นไป: คำนวณค่างวดใหม่จาก scheduledBalance (ไม่นับเงินโป๊ะ) เพื่อให้การโป๊ะไปลดอายุสัญญา\n          const monthsLeft = Math.max(1, totalMonths - (i - 1));\n          lockedInstallment = r === 0 ? scheduledBalance / monthsLeft : -PMT(r, monthsLeft, scheduledBalance);\n        }\n      } else { // step3\n        const monthsLeft = Math.max(1, totalMonths - (i - 1));\n        lockedInstallment = r === 0 ? scheduledBalance / monthsLeft : -PMT(r, monthsLeft, scheduledBalance);\n      }\n    }\n    let monthlyInstallment = lockedInstallment != null ? lockedInstallment : baseMonthly;\n    let principalPart = monthlyInstallment - interest;\n    const extraIdx = yearIdx <= 3 ? yearIdx - 1 : 3;\n    let extra = Math.max(0, extras[extraIdx] || 0);\n    // ป้องกัน infinite loop: ถ้า installment คุมดอกเบี้ยไม่ได้ (negative amortization) + ไม่มีโป๊ะ ให้บังคับชำระดอกเบี้ยทั้งหมด\n    if (principalPart < 0 && extra <= 0) {\n      principalPart = 0;\n      monthlyInstallment = interest;\n    } else if (principalPart < 0) {\n      principalPart = 0;\n    }\n    if (principalPart + extra >= balance) {\n      principalPart = Math.max(0, balance - extra);\n      if (principalPart + extra > balance) {\n        extra = Math.max(0, balance - principalPart);\n      }\n    }\n    balance = Math.max(0, balance - principalPart - extra);\n    // อัปเดต scheduledBalance ตามค่างวดที่ล็อก (ดอกเบี้ยจาก scheduledBalance) — โดยไม่หัก extras\n    const scheduledInterest = scheduledBalance * r;\n    let scheduledPrincipal = monthlyInstallment - scheduledInterest;\n    if (scheduledPrincipal < 0) scheduledPrincipal = 0;\n    if (scheduledPrincipal > scheduledBalance) scheduledPrincipal = scheduledBalance;\n    scheduledBalance = Math.max(0, scheduledBalance - scheduledPrincipal);\n    totalInterest += interest;\n    totalExtra += extra;\n    rows.push({\n      month: i,\n      ratePct,\n      payment: principalPart + interest + extra,\n      principal: principalPart,\n      extra: extra,\n      interest: interest,\n      balance: balance\n    });\n    i++;\n  }\n  return {\n    rows,\n    baseMonthly,\n    n: rows.length,\n    totalInterest,\n    totalExtra,\n    totalPayment: rows.reduce((s, r) => s + r.payment, 0)\n  };\n}\n\nfunction yearsMonthsLabel(months) {\n  const y = Math.floor(months / 12);\n  const m = months % 12;\n  if (y && m) return `${y} ปี ${m} เดือน`;\n  if (y) return `${y} ปี`;\n  return `${m} เดือน`;\n}\n\nfunction buildFlatSchedule(principal, annualRatePct, years) {\n  const n = Math.round(years * 12);\n  const totalInterest = principal * (annualRatePct / 100) * years;\n  const monthly = (principal + totalInterest) / n;\n  const principalPerMonth = principal / n;\n  const interestPerMonth = totalInterest / n;\n  const rows = [];\n  let balance = principal;\n  for (let i = 1; i <= n; i++) {\n    let p = principalPerMonth;\n    if (i === n) p = balance;\n    balance = Math.max(0, balance - p);\n    rows.push({\n      month: i,\n      payment: monthly,\n      principal: p,\n      interest: interestPerMonth,\n      balance: balance\n    });\n  }\n  return { rows, monthly, n, totalInterest, totalPayment: monthly * n };\n}\n\n/* =========================================================\n   Render helpers\n   ========================================================= */\nfunction setOut(key, value) {\n  document.querySelectorAll(`[data-out=\"${key}\"]`).forEach(el => el.textContent = value);\n}\n\nfunction num(id) {\n  const v = parseFloat(document.getElementById(id).value);\n  return isNaN(v) ? 0 : v;\n}\n\nfunction renderSchedule(container, rows, opts) {\n  opts = opts || {};\n  if (!rows.length) { container.innerHTML = ''; return; }\n  const showExtra = opts.showExtra;\n  let html = `\n    <div class=\"table-wrap\">\n      <table>\n        <thead>\n          <tr>\n            <th>งวดที่<\u002Fth>\n            <th>ค่างวด<\u002Fth>\n            <th>เงินต้น<\u002Fth>\n            ${showExtra ? '<th>โป๊ะ<\u002Fth>' : ''}\n            <th>ดอกเบี้ย<\u002Fth>\n            <th>ยอดคงเหลือ<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>`;\n  for (const r of rows) {\n    const isYearEnd = r.month % 12 === 0;\n    html += `<tr${isYearEnd ? ' class=\"year-end\"' : ''}>\n      <td>${r.month}<\u002Ftd>\n      <td>${money(r.payment)}<\u002Ftd>\n      <td>${money(r.principal)}<\u002Ftd>\n      ${showExtra ? `<td style=\"color:var(--primary);\">${r.extra ? money(r.extra) : '—'}<\u002Ftd>` : ''}\n      <td>${money(r.interest)}<\u002Ftd>\n      <td>${money(r.balance)}<\u002Ftd>\n    <\u002Ftr>`;\n  }\n  html += `<\u002Ftbody><\u002Ftable><\u002Fdiv>\n    <div class=\"help\" style=\"margin-top:8px;\">แถวที่เน้นสี = ครบปี (ทุก 12 เดือน)<\u002Fdiv>`;\n  container.innerHTML = html;\n}\n\nfunction renderHomeChart(baseRows, extraRows) {\n  const svg = document.getElementById('h-chart');\n  if (!svg) return;\n  const W = 800, H = 320;\n  const padL = 60, padR = 16, padT = 16, padB = 36;\n  const innerW = W - padL - padR;\n  const innerH = H - padT - padB;\n\n  const maxMonths = Math.max(baseRows.length, extraRows.length, 1);\n  const startBal = Math.max(\n    baseRows[0] ? baseRows[0].balance + baseRows[0].principal : 0,\n    extraRows[0] ? extraRows[0].balance + extraRows[0].principal + (extraRows[0].extra || 0) : 0\n  );\n  const maxBal = startBal || 1;\n\n  const x = (m) => padL + (m / maxMonths) * innerW;\n  const y = (b) => padT + innerH - (b / maxBal) * innerH;\n\n  const pathFor = (rows) => {\n    if (!rows.length) return '';\n    let d = `M ${x(0).toFixed(1)} ${y(maxBal).toFixed(1)}`;\n    for (const r of rows) {\n      d += ` L ${x(r.month).toFixed(1)} ${y(r.balance).toFixed(1)}`;\n    }\n    return d;\n  };\n  const areaFor = (rows) => {\n    if (!rows.length) return '';\n    let d = `M ${x(0).toFixed(1)} ${y(0).toFixed(1)} L ${x(0).toFixed(1)} ${y(maxBal).toFixed(1)}`;\n    for (const r of rows) {\n      d += ` L ${x(r.month).toFixed(1)} ${y(r.balance).toFixed(1)}`;\n    }\n    d += ` L ${x(rows[rows.length-1].month).toFixed(1)} ${y(0).toFixed(1)} Z`;\n    return d;\n  };\n\n  // Y-axis ticks (4)\n  const yticks = [];\n  for (let i = 0; i <= 4; i++) {\n    const v = maxBal * (i / 4);\n    yticks.push({ y: y(v), label: i === 0 ? '0' : (v >= 1e6 ? (v/1e6).toFixed(1) + 'M' : Math.round(v/1000) + 'K') });\n  }\n  // X-axis ticks: every ~5 years\n  const totalYears = Math.ceil(maxMonths / 12);\n  const yearStep = totalYears <= 10 ? 1 : (totalYears <= 20 ? 2 : 5);\n  const xticks = [];\n  for (let yr = 0; yr <= totalYears; yr += yearStep) {\n    xticks.push({ x: x(yr * 12), label: yr });\n  }\n\n  let svgHtml = '';\n  // Grid\n  for (const t of yticks) {\n    svgHtml += `<line x1=\"${padL}\" x2=\"${W-padR}\" y1=\"${t.y.toFixed(1)}\" y2=\"${t.y.toFixed(1)}\" stroke=\"#ece2d2\" stroke-width=\"1\"/>`;\n    svgHtml += `<text x=\"${padL-8}\" y=\"${(t.y+4).toFixed(1)}\" font-size=\"11\" fill=\"#9a7a6c\" text-anchor=\"end\" font-family=\"Sarabun,sans-serif\">${t.label}<\u002Ftext>`;\n  }\n  for (const t of xticks) {\n    svgHtml += `<text x=\"${t.x.toFixed(1)}\" y=\"${H-padB+18}\" font-size=\"11\" fill=\"#9a7a6c\" text-anchor=\"middle\" font-family=\"Sarabun,sans-serif\">${t.label}ป<\u002Ftext>`;\n  }\n  // Axes\n  svgHtml += `<line x1=\"${padL}\" x2=\"${padL}\" y1=\"${padT}\" y2=\"${H-padB}\" stroke=\"#d9caaf\" stroke-width=\"1\"/>`;\n  svgHtml += `<line x1=\"${padL}\" x2=\"${W-padR}\" y1=\"${H-padB}\" y2=\"${H-padB}\" stroke=\"#d9caaf\" stroke-width=\"1\"/>`;\n\n  // Areas\n  svgHtml += `<path d=\"${areaFor(baseRows)}\" fill=\"#9a7a6c\" fill-opacity=\"0.10\"/>`;\n  svgHtml += `<path d=\"${areaFor(extraRows)}\" fill=\"#7a1e2b\" fill-opacity=\"0.12\"/>`;\n\n  // Lines\n  svgHtml += `<path d=\"${pathFor(baseRows)}\" fill=\"none\" stroke=\"#9a7a6c\" stroke-width=\"2\" stroke-linejoin=\"round\"/>`;\n  svgHtml += `<path d=\"${pathFor(extraRows)}\" fill=\"none\" stroke=\"#7a1e2b\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>`;\n\n  // End-point dots\n  if (baseRows.length) {\n    const last = baseRows[baseRows.length-1];\n    svgHtml += `<circle cx=\"${x(last.month).toFixed(1)}\" cy=\"${y(last.balance).toFixed(1)}\" r=\"4\" fill=\"#9a7a6c\"/>`;\n  }\n  if (extraRows.length) {\n    const last = extraRows[extraRows.length-1];\n    svgHtml += `<circle cx=\"${x(last.month).toFixed(1)}\" cy=\"${y(last.balance).toFixed(1)}\" r=\"4\" fill=\"#7a1e2b\"/>`;\n  }\n\n  // Y-axis title\n  svgHtml += `<text x=\"${padL-44}\" y=\"${padT+10}\" font-size=\"10\" fill=\"#6b4a3e\" font-family=\"Sarabun,sans-serif\">บาท<\u002Ftext>`;\n\n  svg.innerHTML = svgHtml;\n}\n\nfunction renderRefiSchedule(container, oldRows, newRows) {\n  const max = Math.max(oldRows.length, newRows.length);\n  let html = `\n    <div class=\"table-wrap\">\n      <table>\n        <thead>\n          <tr>\n            <th>งวดที่<\u002Fth>\n            <th>ค่างวดเดิม<\u002Fth>\n            <th>คงเหลือเดิม<\u002Fth>\n            <th>ค่างวดใหม่<\u002Fth>\n            <th>คงเหลือใหม่<\u002Fth>\n            <th>ประหยัด<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>`;\n  for (let i = 0; i < max; i++) {\n    const o = oldRows[i] || { payment: 0, balance: 0 };\n    const nw = newRows[i] || { payment: 0, balance: 0 };\n    const saved = (o.payment || 0) - (nw.payment || 0);\n    const isYearEnd = (i + 1) % 12 === 0;\n    html += `<tr${isYearEnd ? ' class=\"year-end\"' : ''}>\n      <td>${i + 1}<\u002Ftd>\n      <td>${o.payment ? money(o.payment) : '—'}<\u002Ftd>\n      <td>${oldRows[i] ? money(o.balance) : '—'}<\u002Ftd>\n      <td>${nw.payment ? money(nw.payment) : '—'}<\u002Ftd>\n      <td>${newRows[i] ? money(nw.balance) : '—'}<\u002Ftd>\n      <td style=\"color:${saved >= 0 ? 'var(--success)' : 'var(--danger)'};\">${saved >= 0 ? '+' : ''}${money(saved)}<\u002Ftd>\n    <\u002Ftr>`;\n  }\n  html += `<\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n  container.innerHTML = html;\n}\n\n/* =========================================================\n   Calculators\n   ========================================================= */\nconst lastResults = { home: {}, personal: {}, refi: {} };\n\nfunction calcHome() {\n  const price = num('h-price');\n  const down = Math.min(num('h-down'), price);\n  const principal = Math.max(0, price - down);\n  const years = Math.max(1, num('h-term'));\n  const rates = [num('h-rate1'), num('h-rate2'), num('h-rate3'), num('h-rate4')];\n  const extras = [num('h-extra1'), num('h-extra2'), num('h-extra3'), num('h-extra4')].map(v => Math.max(0, v));\n  const totalExtraInput = extras[0]+extras[1]+extras[2]+extras[3];\n  const modeBtn = document.querySelector('#h-mode [aria-selected=\"true\"]');\n  const mode = modeBtn ? modeBtn.dataset.mode : 'flat3';\n\n  // Base scenario: ผ่อนปกติ (ไม่โป๊ะ)\n  const base = buildHomeSchedule(principal, rates, years, [0,0,0,0], mode);\n  // Extra scenario: ผ่อน + โป๊ะเงินต้นรายปี\n  const withExtra = buildHomeSchedule(principal, rates, years, extras, mode);\n\n  setOut('h-principal', moneyR(principal));\n  setOut('h-interest', moneyR(base.totalInterest));\n  setOut('h-total', moneyR(base.totalPayment));\n  setOut('h-n', base.n);\n  setOut('h-payoff-note', `ผ่อนตามสัญญา ${yearsMonthsLabel(base.n)}`);\n\n  // Per-year installment summary: ค่างวด+โป๊ะ รวม (use first month of each year from withExtra)\n  const yearMonths = [0, 12, 24, 36];\n  for (let yi = 0; yi < 4; yi++) {\n    const idx = yearMonths[yi];\n    const row = withExtra.rows[idx] || base.rows[idx] || null;\n    const fallbackRate = rates[yi];\n    // ยอดรวม = เงินงวด + เงินโป๊ะ\n    const pay = row ? (row.principal + row.interest + (row.extra || 0)) : 0;\n    setOut('yi-rate' + (yi + 1), fmt2.format(row ? row.ratePct : fallbackRate));\n    setOut('yi-pay' + (yi + 1), moneyR(pay));\n    setOut('yi-extra' + (yi + 1), moneyR(extras[yi] || 0));\n  }\n  // ปีสุดท้าย (ระยะเวลาคงเหลือจริง ปัดเป็นปี)\n  const lastYear = Math.max(4, Math.ceil(withExtra.n / 12));\n  setOut('yi-y4-end', 'ปีที่ ' + lastYear);\n\n  // Comparison summary cards\n  setOut('cmp-base-principal', moneyR(principal));\n  setOut('cmp-base-interest', moneyR(base.totalInterest));\n  setOut('cmp-base-term', yearsMonthsLabel(base.n));\n  setOut('cmp-extra-amt', totalExtraInput > 0\n    ? `ป1:${moneyR(extras[0])} · ป2:${moneyR(extras[1])} · ป3:${moneyR(extras[2])} · ป4+:${moneyR(extras[3])}`\n    : moneyR(0));\n  setOut('cmp-extra-principal', moneyR(principal));\n  setOut('cmp-extra-interest', moneyR(withExtra.totalInterest));\n  setOut('cmp-extra-term', yearsMonthsLabel(withExtra.n));\n\n  // Savings\n  const interestSaved = base.totalInterest - withExtra.totalInterest;\n  const monthsSaved = base.n - withExtra.n;\n  const totalSaved = base.totalPayment - withExtra.totalPayment;\n\n  // ยอดเงินต้นคงเหลือสิ้นปีที่ 3 (เริ่มต้นเดือนปีที่ 4 — สำหรับรีไฟแนนซ์)\n  const monthEndY3 = withExtra.rows[35];\n  const balanceY3 = monthEndY3 ? monthEndY3.balance : (withExtra.rows.length ? withExtra.rows[withExtra.rows.length-1].balance : principal);\n\n  // headline สรุปการโป๊ะ\n  const extrasSummary = totalExtraInput > 0\n    ? `ป1:฿${moneyR(extras[0])} · ป2:฿${moneyR(extras[1])} · ป3:฿${moneyR(extras[2])} · ป4+:฿${moneyR(extras[3])}`\n    : '฿0';\n  setOut('sv-extra', extrasSummary);\n  setOut('sv-interest', moneyR(Math.max(0, interestSaved)));\n  setOut('sv-time', monthsSaved > 0 ? yearsMonthsLabel(monthsSaved) : '—');\n  setOut('sv-total', moneyR(Math.max(0, totalSaved)));\n  setOut('sv-y3-balance', moneyR(balanceY3));\n  document.getElementById('h-savings-summary').classList.toggle('zero', totalExtraInput <= 0);\n\n  // Chart\n  renderHomeChart(base.rows, withExtra.rows);\n\n  // Schedule (with extra column when applicable)\n  renderSchedule(\n    document.querySelector('[data-amort-content=\"home\"]'),\n    withExtra.rows,\n    { showExtra: totalExtraInput > 0 }\n  );\n\n  lastResults.home = {\n    principal, rates, years, extras, mode,\n    monthly: base.baseMonthly,\n    baseInterest: base.totalInterest,\n    baseTotal: base.totalPayment,\n    baseN: base.n,\n    extraInterest: withExtra.totalInterest,\n    extraTotal: withExtra.totalPayment,\n    extraN: withExtra.n,\n    interestSaved,\n    monthsSaved,\n    totalSaved\n  };\n}\n\nfunction calcPersonal() {\n  const amount = num('p-amount');\n  const down = Math.min(num('p-down'), amount);\n  const principal = Math.max(0, amount - down);\n  const rate = num('p-rate');\n  const years = Math.max(1, num('p-term'));\n  const method = document.querySelector('#p-method [aria-selected=\"true\"]').dataset.method;\n\n  let s;\n  if (method === 'flat') {\n    s = buildFlatSchedule(principal, rate, years);\n  } else {\n    s = buildReducingSchedule(principal, rate, years);\n  }\n\n  let effective = rate;\n  if (method === 'flat' && principal > 0) {\n    effective = solveEffectiveRate(principal, s.monthly, s.n);\n  }\n\n  setOut('p-monthly', moneyR(s.monthly));\n  setOut('p-interest', moneyR(s.totalInterest));\n  setOut('p-total', moneyR(s.totalPayment));\n  setOut('p-n', s.n);\n  setOut('p-effective', fmt2.format(effective));\n  setOut('p-method-label', method === 'flat' ? 'ดอกเบี้ยคงที่' : 'ลดต้นลดดอก');\n\n  renderSchedule(document.querySelector('[data-amort-content=\"personal\"]'), s.rows);\n  lastResults.personal = {\n    principal, rate, years, method,\n    monthly: s.monthly,\n    interest: s.totalInterest,\n    total: s.totalPayment,\n    n: s.n,\n    effective\n  };\n}\n\nfunction solveEffectiveRate(pv, payment, n) {\n  let r = 0.005;\n  for (let i = 0; i < 80; i++) {\n    const f = PMT(r, n, pv) + payment;\n    const dr = 0.0000001;\n    const f2 = PMT(r + dr, n, pv) + payment;\n    const der = (f2 - f) / dr;\n    if (Math.abs(der) < 1e-12) break;\n    const next = r - f / der;\n    if (Math.abs(next - r) < 1e-10) { r = next; break; }\n    r = Math.max(0, next);\n  }\n  return r * 12 * 100;\n}\n\nfunction calcRefi() {\n  const oldP = num('r-old-principal');\n  const oldR = num('r-old-rate');\n  const oldT = Math.max(1, num('r-old-term'));\n  const newP = num('r-new-principal');\n  const newR = num('r-new-rate');\n  const newT = Math.max(1, num('r-new-term'));\n  const fees = num('r-fees');\n\n  const oldS = buildReducingSchedule(oldP, oldR, oldT);\n  const newS = buildReducingSchedule(newP, newR, newT);\n\n  const monthlySaving = oldS.monthly - newS.monthly;\n  const totalSaving = oldS.totalPayment - newS.totalPayment - fees;\n  const interestSaved = oldS.totalInterest - newS.totalInterest;\n\n  let breakeven = '—';\n  if (monthlySaving > 0 && fees > 0) {\n    const months = Math.ceil(fees / monthlySaving);\n    breakeven = `${months} เดือน`;\n  } else if (monthlySaving > 0 && fees === 0) {\n    breakeven = 'ทันที';\n  } else if (monthlySaving <= 0) {\n    breakeven = 'ไม่คุ้ม';\n  }\n\n  setOut('r-saving-monthly', moneyR(monthlySaving));\n  setOut('r-saving-total', moneyR(totalSaving));\n  setOut('r-saving-interest', moneyR(interestSaved));\n  setOut('r-old-monthly', moneyR(oldS.monthly));\n  setOut('r-new-monthly', moneyR(newS.monthly));\n  setOut('r-breakeven', breakeven);\n\n  const hero = document.getElementById('r-result');\n  hero.classList.toggle('negative', monthlySaving <= 0);\n\n  renderRefiSchedule(document.querySelector('[data-amort-content=\"refi\"]'), oldS.rows, newS.rows);\n\n  lastResults.refi = {\n    oldMonthly: oldS.monthly,\n    newMonthly: newS.monthly,\n    monthlySaving,\n    totalSaving,\n    interestSaved,\n    breakeven,\n    fees\n  };\n}\n\n/* =========================================================\n   Tabs + events\n   ========================================================= */\ndocument.querySelectorAll('.tab').forEach(t => {\n  t.addEventListener('click', () => {\n    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', 'false'));\n    t.setAttribute('aria-selected', 'true');\n    const target = t.dataset.tab;\n    document.querySelectorAll('[data-panel]').forEach(p => {\n      p.classList.toggle('hidden', p.dataset.panel !== target);\n    });\n  });\n});\n\ndocument.querySelectorAll('#p-method button').forEach(b => {\n  b.addEventListener('click', () => {\n    document.querySelectorAll('#p-method button').forEach(x => x.setAttribute('aria-selected', 'false'));\n    b.setAttribute('aria-selected', 'true');\n    const help = document.getElementById('p-method-help');\n    help.textContent = b.dataset.method === 'flat'\n      ? 'ดอกเบี้ยคงที่: คิดดอกเบี้ยจากเงินต้นเดิมตลอดอายุสัญญา (สินเชื่อรถ / เช่าซื้อทั่วไป)'\n      : 'ลดต้นลดดอก: คิดดอกเบี้ยจากเงินต้นคงเหลือในแต่ละเดือน (สินเชื่อส่วนบุคคลของธนาคารทั่วไป)';\n    calcPersonal();\n  });\n});\n\ndocument.querySelectorAll('#h-mode button').forEach(b => {\n  b.addEventListener('click', () => {\n    document.querySelectorAll('#h-mode button').forEach(x => x.setAttribute('aria-selected', 'false'));\n    b.setAttribute('aria-selected', 'true');\n    const help = document.getElementById('h-mode-help');\n    const m = b.dataset.mode;\n    if (m === 'flat3') help.textContent = 'ค่างวดเท่ากันทุกงวดตลอดอายุสัญญา คำนวณจากอัตราปีที่ 4 เป็นต้นไป';\n    else if (m === 'step1') help.textContent = '3 ปีแรกผ่อนเท่ากัน (ใช้ดอกเบี้ยสูงสุดในช่วงโปร) แล้วปีที่ 4 ค่างวดจะปรับเป็นตามดอกเบี้ยปีที่ 4';\n    else help.textContent = 'ค่างวดเปลี่ยนทุกครั้งที่ขึ้นปีใหม่ คำนวณจากเงินต้นคงเหลือ + ระยะเวลาคงเหลือ + ดอกเบี้ยของปีนั้น';\n    calcHome();\n  });\n});\n\nconst homeInputs = ['h-price', 'h-down', 'h-term', 'h-rate1', 'h-rate2', 'h-rate3', 'h-rate4', 'h-extra1', 'h-extra2', 'h-extra3', 'h-extra4'];\nconst personalInputs = ['p-amount', 'p-down', 'p-rate', 'p-term'];\nconst refiInputs = ['r-old-principal', 'r-old-rate', 'r-old-term', 'r-new-principal', 'r-new-rate', 'r-new-term', 'r-fees'];\n\nhomeInputs.forEach(id => document.getElementById(id).addEventListener('input', calcHome));\npersonalInputs.forEach(id => document.getElementById(id).addEventListener('input', calcPersonal));\nrefiInputs.forEach(id => document.getElementById(id).addEventListener('input', calcRefi));\n\ndocument.querySelectorAll('.amort-toggle').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const expanded = btn.getAttribute('aria-expanded') === 'true';\n    btn.setAttribute('aria-expanded', String(!expanded));\n    const content = document.querySelector(`[data-amort-content=\"${btn.dataset.amort}\"]`);\n    content.classList.toggle('open', !expanded);\n  });\n});\n\ndocument.querySelectorAll('[data-action=\"copy\"]').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const mode = btn.dataset.mode;\n    const r = lastResults[mode];\n    let text = '';\n    if (mode === 'home') {\n      text = `สรุปสินเชื่อบ้าน\\n` +\n        `─────────────────────\\n` +\n        `ยอดกู้:           ฿${moneyR(r.principal)}\\n` +\n        `ดอกเบี้ย:         ปี1 ${r.rates[0]}% · ปี2 ${r.rates[1]}% · ปี3 ${r.rates[2]}% · ปี4+ ${r.rates[3]}%\\n` +\n        `ระยะเวลาสัญญา:   ${r.years} ปี\\n` +\n        `ค่างวด/เดือน:    ฿${moneyR(r.monthly)}\\n` +\n        `\\n` +\n        `[ผ่อนปกติ]\\n` +\n        `  ดอกเบี้ยรวม:    ฿${moneyR(r.baseInterest)}\\n` +\n        `  ยอดผ่อนรวม:    ฿${moneyR(r.baseTotal)}\\n` +\n        `  ระยะเวลาจริง:   ${r.baseN} งวด\\n` +\n        `\\n` +\n        `[โป๊ะเงินต้นเดือนละ ฿${moneyR(r.extra)}]\\n` +\n        `  ดอกเบี้ยรวม:    ฿${moneyR(r.extraInterest)}\\n` +\n        `  ยอดผ่อนรวม:    ฿${moneyR(r.extraTotal)}\\n` +\n        `  ระยะเวลาจริง:   ${r.extraN} งวด\\n` +\n        `\\n` +\n        `ประหยัดดอกเบี้ย:  ฿${moneyR(Math.max(0, r.interestSaved))}\\n` +\n        `ปลดหนี้เร็วขึ้น:   ${r.monthsSaved > 0 ? r.monthsSaved + ' งวด' : '—'}`;\n    } else if (mode === 'personal') {\n      text = `สรุปสินเชื่อส่วนบุคคล / รถ\\n` +\n        `─────────────────────\\n` +\n        `วิธีคำนวณ:       ${r.method === 'flat' ? 'ดอกเบี้ยคงที่' : 'ลดต้นลดดอก'}\\n` +\n        `ยอดกู้:           ฿${moneyR(r.principal)}\\n` +\n        `ดอกเบี้ย:         ${r.rate}% / ปี (อัตราที่แท้จริง ${fmt2.format(r.effective)}%)\\n` +\n        `ระยะเวลา:        ${r.years} ปี (${r.n} งวด)\\n` +\n        `ค่างวด/เดือน:    ฿${moneyR(r.monthly)}\\n` +\n        `ดอกเบี้ยรวม:     ฿${moneyR(r.interest)}\\n` +\n        `ยอดผ่อนรวม:     ฿${moneyR(r.total)}`;\n    } else {\n      text = `สรุปการรีไฟแนนซ์\\n` +\n        `─────────────────────\\n` +\n        `ค่างวดเดิม:      ฿${moneyR(r.oldMonthly)}\\n` +\n        `ค่างวดใหม่:      ฿${moneyR(r.newMonthly)}\\n` +\n        `ประหยัด/เดือน:   ฿${moneyR(r.monthlySaving)}\\n` +\n        `จุดคุ้มทุน:        ${r.breakeven}\\n` +\n        `ประหยัดรวม:     ฿${moneyR(r.totalSaving)}\\n` +\n        `ดอกเบี้ยที่ลด:    ฿${moneyR(r.interestSaved)}`;\n    }\n    navigator.clipboard.writeText(text).then(() => {\n      showToast('คัดลอกผลลัพธ์แล้ว');\n    }).catch(() => {\n      const ta = document.createElement('textarea');\n      ta.value = text;\n      document.body.appendChild(ta);\n      ta.select();\n      document.execCommand('copy');\n      ta.remove();\n      showToast('คัดลอกผลลัพธ์แล้ว');\n    });\n  });\n});\n\nfunction showToast(msg) {\n  const t = document.getElementById('toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  setTimeout(() => t.classList.remove('show'), 1800);\n}\n\ncalcHome();\ncalcPersonal();\ncalcRefi();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
